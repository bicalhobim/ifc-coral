<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1240" viewBox="0 0 1800 1240"><rect width="100%" height="100%" fill="#f7f4fc"/><text x="70" y="57" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#8400db">IFC CORAL  |  JORNADA DE APRENDIZAGEM</text><text x="70" y="119" font-family="Segoe UI,Arial,sans-serif" font-size="44" font-weight="700" fill="#241b34">Da tarefa planejada ao trabalho executável</text><text x="70" y="161" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#655c76">Planejamento e Gestão de Obras com IA • EBPÓS • Professor Lucas Bicalho</text><polyline points="635,306 710,306 710,600 750,600" fill="none" stroke="#b6a1d3" stroke-width="4"/><polyline points="1050,600 1090,600 1090,306 1165,306" fill="none" stroke="#b6a1d3" stroke-width="4"/><polyline points="635,516 710,516 710,600 750,600" fill="none" stroke="#b6a1d3" stroke-width="4"/><polyline points="1050,600 1090,600 1090,516 1165,516" fill="none" stroke="#b6a1d3" stroke-width="4"/><polyline points="635,726 710,726 710,600 750,600" fill="none" stroke="#b6a1d3" stroke-width="4"/><polyline points="1050,600 1090,600 1090,726 1165,726" fill="none" stroke="#b6a1d3" stroke-width="4"/><polyline points="635,936 710,936 710,600 750,600" fill="none" stroke="#b6a1d3" stroke-width="4"/><polyline points="1050,600 1090,600 1090,936 1165,936" fill="none" stroke="#b6a1d3" stroke-width="4"/><rect x="60" y="230" width="575" height="170" rx="22" fill="#ffffff" stroke="#ded3ed" stroke-width="2"/><text x="85" y="275" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#8400db">01  LEAN E FLUXO</text><text x="85" y="326" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#241b34">Reduzir esperas, variabilidade e retrabalho.</text><text x="85" y="363" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#241b34">Entregar valor e proteger a produção.</text><rect x="60" y="440" width="575" height="170" rx="22" fill="#ffffff" stroke="#ded3ed" stroke-width="2"/><text x="85" y="485" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#8400db">02  AS CONVERSAS DO LPS</text><text x="85" y="536" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#241b34">Should → Can → Will → Did → Learn</text><text x="85" y="573" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#241b34">Preparar antes de assumir o compromisso.</text><rect x="60" y="650" width="575" height="170" rx="22" fill="#ffffff" stroke="#ded3ed" stroke-width="2"/><text x="85" y="695" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#8400db">03  IFC E PLANEJAMENTO 4D</text><text x="85" y="746" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#241b34">Identificar elementos, locais e sequências.</text><text x="85" y="783" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#241b34">Conferir de onde vêm quantidades e datas.</text><rect x="60" y="860" width="575" height="170" rx="22" fill="#ffffff" stroke="#ded3ed" stroke-width="2"/><text x="85" y="905" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#8400db">04  PACOTES POR SERVIÇO</text><text x="85" y="956" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#241b34">Elementos + local + serviço + período.</text><text x="85" y="993" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#241b34">Quantidade, responsável e critério de conclusão.</text><rect x="1165" y="230" width="575" height="170" rx="22" fill="#ffffff" stroke="#ded3ed" stroke-width="2"/><text x="1190" y="275" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#8400db">05  RESTRIÇÕES E EVIDÊNCIAS</text><text x="1190" y="326" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#241b34">Identificar impedimentos e atribuir ações.</text><text x="1190" y="363" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#241b34">Registrar responsável, prazo e comprovação.</text><rect x="1165" y="440" width="575" height="170" rx="22" fill="#ffffff" stroke="#ded3ed" stroke-width="2"/><text x="1190" y="485" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#8400db">06  SUPRIMENTOS NA HORA CERTA</text><text x="1190" y="536" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#241b34">Relacionar demanda e necessidade em obra.</text><text x="1190" y="573" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#241b34">Conferir cobertura, prazos e disponibilidade.</text><rect x="1165" y="650" width="575" height="170" rx="22" fill="#ffffff" stroke="#ded3ed" stroke-width="2"/><text x="1190" y="695" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#8400db">07  PPC E APRENDIZADO</text><text x="1190" y="746" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#241b34">Comparar compromissos e conclusões.</text><text x="1190" y="783" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#241b34">Tratar causas de desvio e proteger marcos.</text><rect x="1165" y="860" width="575" height="170" rx="22" fill="#ffffff" stroke="#ded3ed" stroke-width="2"/><text x="1190" y="905" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#8400db">08  IA COM REVISÃO HUMANA</text><text x="1190" y="956" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#241b34">Organizar informações e sugerir análises.</text><text x="1190" y="993" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#241b34">Pessoas conferem, decidem e liberam.</text><rect x="750" y="485" width="300" height="230" rx="30" fill="#530086" stroke="#530086" stroke-width="2"/><text x="777" y="552" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#ffffff">PODEMOS</text><text x="777" y="602" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#ffffff">ASSUMIR ESTE</text><text x="777" y="652" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#ffffff">COMPROMISSO?</text><rect x="60" y="1085" width="1680" height="75" rx="18" fill="#eee5f8" stroke="#eee5f8" stroke-width="2"/><text x="90" y="1129" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#241b34">O cronograma indica intenção. A preparação verifica condições. A equipe assume e aprende.</text><text x="70" y="1209" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#655c76">Síntese de consulta ao NotebookLM IAT 001 • Diagramação local • 06/11/2026 • Mapa conceitual da aula</text></svg>