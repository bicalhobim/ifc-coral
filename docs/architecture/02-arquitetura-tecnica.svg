<text x="839" y="1316" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#655C72">I/O</text>
<rect x="1825" y="290" width="975" height="255" rx="24" fill="#FFFFFF" stroke="#A1CFD2" stroke-width="2"/>
<text x="1860" y="335" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#087F8C">IA POR CHAVE INDIVIDUAL</text>
<text x="1860" y="380" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#261B36">OpenAI / Gemini</text>
<text x="1860" y="424" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#261B36">Chamada direta do navegador ao provedor.</text>
<text x="1860" y="463" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#261B36">Chave e modelo informados pelo usuário; chave só em memória.</text>
<text x="1860" y="502" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#261B36">Integrações implementadas; chave real ainda não ensaiada.</text>
<path d="M1697 460 H1812" fill="none" stroke="#7500C0" stroke-width="4" stroke-linejoin="round"/>
<polygon points="1812.00,460.00 1795.00,468.00 1795.00,452.00" fill="#7500C0"/>
<rect x="1691" y="415" width="100" height="34" rx="8" fill="#F7F4FB" stroke="#F7F4FB" stroke-width="2"/>
<text x="1701" y="439" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#655C72">HTTPS</text>
<rect x="1825" y="602" width="975" height="245" rx="24" fill="#FFFFFF" stroke="#A1CFD2" stroke-width="2"/>
<text x="1860" y="647" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#087F8C">IA VIA CODEX</text>
<text x="1860" y="692" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#261B36">CLI local → inferência remota</text>
<text x="1860" y="737" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#261B36">Conta autenticada e modelo disponível no Codex.</text>
<text x="1860" y="776" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#261B36">Contexto estruturado do pacote; proposta revisada pelo usuário.</text>
<text x="1860" y="815" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#261B36">Chamada real registrada no QA; não usa esta conversa aberta.</text>
<path d="M785 1110 V1053 H1745 V724 H1812" fill="none" stroke="#7500C0" stroke-width="4" stroke-linejoin="round"/>
<polygon points="1812.00,724.00 1795.00,732.00 1795.00,716.00" fill="#7500C0"/>
<rect x="1220" y="1054" width="316" height="34" rx="8" fill="#F7F4FB" stroke="#F7F4FB" stroke-width="2"/>
<text x="1230" y="1078" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#655C72">CLI + contexto do pacote</text>
<rect x="1825" y="904" width="975" height="218" rx="24" fill="#FFFFFF" stroke="#D2C2E3" stroke-width="2" stroke-dasharray="10 7"/>
<text x="1860" y="949" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#7500C0">FERRAMENTA OFFLINE OPCIONAL</text>
<text x="1860" y="994" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#261B36">Python + IfcOpenShell</text>
<text x="1860" y="1040" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#261B36">Processa geometria e gera relatório JSON para a quantificação.</text>
<text x="1860" y="1081" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#655C72">Não é o back-end principal nem requisito para todo cálculo.</text>
<path d="M1811 992 H1698" fill="none" stroke="#7500C0" stroke-width="4" stroke-linejoin="round"/>
<polygon points="1698.00,992.00 1715.00,984.00 1715.00,1000.00" fill="#7500C0"/>
<rect x="1691" y="946" width="77" height="34" rx="8" fill="#F7F4FB" stroke="#F7F4FB" stroke-width="2"/>
<text x="1701" y="970" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#655C72">JSON</text>
<rect x="1825" y="1180" width="975" height="345" rx="24" fill="#FFFFFF" stroke="#B98BDF" stroke-width="2"/>
<text x="1860" y="1225" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#7500C0">INTEGRAÇÃO ENTRE APLICATIVOS</text>
<text x="1860" y="1270" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#261B36">IFC Coral → Compras IA</text>
<text x="1860" y="1318" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#261B36">Snapshot JSON v1: demandas + vínculos + premissas.</text>
<text x="1860" y="1357" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#261B36">Contrato, schema e fingerprints conferidos no exportador.</text>
<text x="1860" y="1396" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#261B36">Troca por arquivo; sem banco compartilhado ou API contínua.</text>
<text x="1860" y="1435" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#261B36">Contato, cotação e pedido pertencem ao outro aplicativo.</text>
<text x="1860" y="1491" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#7500C0">Ensaio completo com o consumidor: próxima validação.</text>
<path d="M1610 1020 V1090 H1765 V1375 H1812" fill="none" stroke="#7500C0" stroke-width="4" stroke-linejoin="round"/>
<polygon points="1812.00,1375.00 1795.00,1383.00 1795.00,1367.00" fill="#7500C0"/>
<rect x="1687" y="1132" width="115" height="34" rx="8" fill="#F7F4FB" stroke="#F7F4FB" stroke-width="2"/>
<text x="1697" y="1156" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#655C72">JSON v1</text>
<rect x="70" y="1581" width="2730" height="148" rx="24" fill="#460073" stroke="#460073" stroke-width="2"/>
<text x="105" y="1629" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#FFFFFF">O IFC ancora a identidade; o projeto local registra as decisões e o que foi conferido.</text>
<text x="105" y="1672" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#FFFFFF">IA propõe. Pessoas revisam e liberam. Datas de planejamento não comprovam execução ou disponibilidade.</text>
<text x="105" y="1708" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#E7C9FF">A entrada atual não autentica contas. Não há nuvem de projetos, compras autônomas ou colaboração multiusuário nesta versão.</text>
<text x="76" y="1770" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#655C72">Professor Lucas Bicalho · High-level design baseado no código local · 04/11/2026</text>
<text x="1970" y="1770" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#7500C0">IFC Coral · arquitetura implementada</text>
