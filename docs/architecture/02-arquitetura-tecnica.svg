<text x="94" y="106" font-family="Arial, sans-serif" font-size="44" font-weight="700" fill="#7500C0">IFC CORAL</text>
<text x="94" y="165" font-family="Arial, sans-serif" font-size="51" font-weight="700" fill="#261B36">Como o sistema funciona — arquitetura atual</text>
<text x="94" y="209" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#655C72">Aplicação web local · regras de planejamento no navegador · persistência em arquivos · IA opcional</text>
<text x="82" y="267" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#7500C0">NO COMPUTADOR DO USUÁRIO</text>
<text x="1834" y="267" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#087F8C">EXTENSÕES E SERVIÇOS OPCIONAIS</text>
<rect x="70" y="290" width="1620" height="725" rx="24" fill="#FFFFFF" stroke="#BA87DF" stroke-width="2"/>
<rect x="70" y="290" width="1620" height="80" rx="24" fill="#460073" stroke="#460073" stroke-width="2"/>
<text x="105" y="341" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#FFFFFF">FRONT-END  |  Navegador</text>
<text x="779" y="341" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#FFFFFF">TypeScript + HTML/CSS · Vite</text>
<rect x="110" y="405" width="520" height="235" rx="24" fill="#F7F0FF" stroke="#E0CBF4" stroke-width="2"/>
<text x="138" y="448" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#7500C0">Modelo e planejamento visual</text>
<text x="138" y="492" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#261B36">IFC, seleção, propriedades e 4D</text>
<text x="138" y="529" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#261B36">Gantt e linha de balanço</text>
<text x="138" y="566" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#261B36">That Open / Fragments + Three.js</text>
<text x="138" y="603" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#261B36">web-ifc WASM + Web Worker</text>
<rect x="665" y="405" width="965" height="235" rx="24" fill="#F7F0FF" stroke="#E0CBF4" stroke-width="2"/>
<text x="694" y="448" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#7500C0">Regras de negócio executadas no navegador</text>
<text x="694" y="492" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#261B36">Catálogos → quantificação → pacotes → restrições</text>
<text x="694" y="529" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#261B36">Composições → mapa de suprimentos → recursos</text>
<text x="694" y="566" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#261B36">Kanban → compromisso semanal → execução / PPC</text>
<text x="694" y="603" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#261B36">Cálculos e estados determinísticos; decisões humanas</text>
<path d="M370 645 V679" fill="none" stroke="#7500C0" stroke-width="4" stroke-linejoin="round"/>
