<polygon points="1150.00,679.00 1142.00,662.00 1158.00,662.00" fill="#7500C0"/>
<rect x="110" y="687" width="1520" height="164" rx="24" fill="#EFE5FA" stroke="#B98BDF" stroke-width="2"/>
<text x="142" y="731" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#7500C0">ESTADO DO PROJETO — operações validadas + histórico</text>
<text x="142" y="774" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#261B36">Modelos · elementos · medições · pacotes · restrições · demandas · compromissos · registros</text>
<text x="142" y="818" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#7500C0">Vínculo estável: modelId + GlobalId   |   Hash identifica a revisão do arquivo IFC</text>
<rect x="110" y="887" width="1520" height="86" rx="15" fill="#F7F7FA" stroke="#E8E3EE" stroke-width="2"/>
<text x="138" y="921" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#655C72">CACHE DO NAVEGADOR  |  IndexedDB + localStorage</text>
<text x="138" y="953" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#655C72">Modelos, recuperação de sessão e preferências. Não substitui o projeto salvo na pasta.</text>
<rect x="70" y="1115" width="760" height="410" rx="24" fill="#FFFFFF" stroke="#97C9CE" stroke-width="2"/>
<text x="104" y="1164" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#087F8C">BACK-END LOCAL</text>
<text x="104" y="1208" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#261B36">Node.js + plugin do Vite</text>
<text x="104" y="1262" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#261B36">Janela de pastas do Windows</text>
<text x="104" y="1302" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#261B36">Leitura / gravação e histórico de arquivos</text>
<text x="104" y="1342" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#261B36">Proteção de requisições locais</text>
<text x="104" y="1382" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#261B36">Executa o Codex CLI instalado</text>
<text x="104" y="1422" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#261B36">HTTP em 127.0.0.1:5178</text>
<text x="104" y="1491" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#655C72">Não é um servidor de contas ou banco central.</text>
<rect x="920" y="1115" width="770" height="410" rx="24" fill="#FFFFFF" stroke="#BA87DF" stroke-width="2"/>
<text x="953" y="1164" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#7500C0">PASTA ESCOLHIDA PARA O PROJETO</text>
<text x="953" y="1212" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#261B36">IFC-Coral.projeto.json</text>
<text x="953" y="1259" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#261B36">Dados + modelos IFC incorporados (base64)</text>
<text x="953" y="1298" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#261B36">Modelos/ — cópias dos arquivos IFC</text>
<text x="953" y="1337" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#261B36">Historico/ — versões locais</text>
<text x="953" y="1376" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#261B36">Exportacoes/ — CSV, JSON e relatórios</text>
<text x="953" y="1444" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#7500C0">Autosave após escolher a pasta + Salvar / Salvar como</text>
<text x="953" y="1491" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#655C72">Armazenamento atual: JSON, sem banco SQL.</text>
